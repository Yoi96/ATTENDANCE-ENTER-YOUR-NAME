<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <title>Attendance Form</title>
</head>  
<body>

<div id="wrap">
  <div id="main_body">
    <div id="fullname">
      <img src="images/logos.png" height="65em">
      <h1>Attendance</h1>
      <h2>Enter Your Name</h2>

      <label>First Name:</label>
      <input type="text" id="firstName" placeholder="Type your first name..."><br>

      <label>Middle Name:</label>
      <input type="text" id="middleName" placeholder="Middle Name"><br>

      <label>Last Name:</label>
      <input type="text" id="lastName" placeholder="Type your last name..."><br>

      <label>OSIS Number/Student ID:</label>
      <input type="text" id="osisNumber" placeholder="OSIS Number"><br>

      <label>Your School:</label>
      <div id="schoolCheckboxes">
        <label><input type="checkbox" value="Mott Hall High School (Harlem)"> Mott Hall High School (Harlem)</label><br>
        <label><input type="checkbox" value="Eagle Academy for Young Men of Harlem"> Eagle Academy for Young Men of Harlem</label><br>
        <label><input type="checkbox" value="Urban Assembly School of Global Commerce"> Urban Assembly School of Global Commerce</label><br>
        <label><input type="checkbox" value="A. Philip Randolph"> A. Philip Randolph</label><br>
      </div><br>

      <button id="submitButton">Submit</button>
      <button id="saveToDBButton">Save to Database</button><br><br>

      <h3>Your name is:</h3>
      <div id="displayName">&nbsp;</div>
    </div>

    <div id="fullname2">
      <h3>Submitted Names:</h3>
      <ul id="submittedNamesList"></ul>
      <button id="saveButton">Save as Text File</button>
      <button><a href="mailto:xiaoyiliu96xyl@gmail.com">Email Names</a></button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://cpnbxqfduxtdufhdkuig.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbmJ4cWZkdXh0ZHVmaGRrdWlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMjg2MjEsImV4cCI6MjA2MzYwNDYyMX0.ipVyFBRyfV_HQjDCR-_wzK-LMTuw0UE3x59gVPOtf7A';

  async function saveToSupabase(data) {
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/students`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(data)
      });

      if (!response.ok) throw new Error(await response.text());
      alert("Saved to Supabase!");
    } catch (error) {
      console.error("Database error:", error);
      alert("Failed to save to database.");
    }
  }

  document.getElementById("submitButton").addEventListener("click", () => {
    const firstName = document.getElementById("firstName").value.trim();
    const middleName = document.getElementById("middleName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const osisNumber = document.getElementById("osisNumber").value.trim();
    const school = Array.from(document.querySelectorAll('#schoolCheckboxes input[type="checkbox"]:checked'))
                        .map(cb => cb.value).join(', ');

    const fullName = `${firstName} ${middleName} ${lastName}`.trim();
    document.getElementById("displayName").innerText = fullName;

    const li = document.createElement("li");
    li.textContent = `${fullName} | OSIS: ${osisNumber} | School: ${school}`;
    document.getElementById("submittedNamesList").appendChild(li);
  });

  document.getElementById("saveToDBButton").addEventListener("click", () => {
    const firstName = document.getElementById("firstName").value.trim();
    const middleName = document.getElementById("middleName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const osisNumber = document.getElementById("osisNumber").value.trim();
    const school = Array.from(document.querySelectorAll('#schoolCheckboxes input[type="checkbox"]:checked'))
                        .map(cb => cb.value).join(', ');

    const data = {
      first_name: firstName,
      middle_name: middleName,
      last_name: lastName,
      osis_id: osisNumber,
      school_name: school
    };
    saveToSupabase(data);
  });

  document.getElementById("saveButton").addEventListener("click", () => {
    const items = document.querySelectorAll("#submittedNamesList li");
    if (items.length === 0) return alert("No names to save.");

    let text = "";
    items.forEach(item => text += item.textContent + "\n");

    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "submitted_names.txt";
    a.click();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Form</title>
  <style>
    /* Basic styling */
    body { font-family: Arial, sans-serif; margin: 20px; }
    #wrap { max-width: 600px; margin: auto; }
    label { display: block; margin-top: 10px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
    #schoolCheckboxes label { display: inline-block; margin-right: 10px; }
    button { margin-top: 15px; padding: 10px 20px; cursor: pointer; }
    #submittedNamesList { margin-top: 20px; }
  </style>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>

<div id="wrap">
  <h1>Attendance</h1>
  <h2>Enter Your Name</h2>

  <label for="firstName">First Name:</label>
  <input type="text" id="firstName" placeholder="Type your first name..." />

  <label for="middleName">Middle Name:</label>
  <input type="text" id="middleName" placeholder="Middle Name" />

  <label for="lastName">Last Name:</label>
  <input type="text" id="lastName" placeholder="Type your last name..." />

  <label for="osisNumber">OSIS Number/Student ID:</label>
  <input type="text" id="osisNumber" placeholder="OSIS Number" />

  <label for="gradeLevel">Grade Level:</label>
  <input type="number" id="gradeLevel" placeholder="e.g., 9" min="1" max="12" />

  <label>Your School:</label>
  <div id="schoolCheckboxes">
    <label><input type="checkbox" value="Mott Hall High School (Harlem)" /> Mott Hall High School (Harlem)</label>
    <label><input type="checkbox" value="Eagle Academy for Young Men of Harlem" /> Eagle Academy for Young Men of Harlem</label>
    <label><input type="checkbox" value="Urban Assembly School of Global Commerce" /> Urban Assembly School of Global Commerce</label>
    <label><input type="checkbox" value="A. Philip Randolph" /> A. Philip Randolph</label>
  </div>

  <button id="submitButton">Submit</button>

  <h3>Your name is:</h3>
  <div id="displayName">&nbsp;</div>

  <h3>Submitted Names:</h3>
  <ul id="submittedNamesList"></ul>
  <button id="saveButton">Save as Text File</button>
  <button id="emailButton"><a href="mailto:xiaoyiliu96xyl@gmail.com">Email Names</a></button>
</div>

<script>
  const SUPABASE_URL = 'https://cpnbxqfduxtdufhdkuig.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbmJ4cWZkdXh0ZHVmaGRrdWlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgwMjg2MjEsImV4cCI6MjA2MzYwNDYyMX0.ipVyFBRyfV_HQjDCR-_wzK-LMTuw0UE3x59gVPOtf7A';

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function saveToSupabase(data) {
    const { error } = await supabase
      .from('students')
      .insert([data]);

    if (error) {
      console.error("Supabase insert error:", error);
      alert("Failed to save to database: " + error.message);
      return false;
    } else {
      alert("Saved to Supabase!");
      return true;
    }
  }

  document.getElementById("submitButton").addEventListener("click", async () => {
    const firstName = document.getElementById("firstName").value.trim();
    const middleName = document.getElementById("middleName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const osisNumber = document.getElementById("osisNumber").value.trim();
    const gradeLevelInput = document.getElementById("gradeLevel");
    const gradeLevel = gradeLevelInput.value.trim();
    const school = Array.from(document.querySelectorAll('#schoolCheckboxes input[type="checkbox"]:checked'))
                        .map(cb => cb.value).join(', ');

    // Validation
    if (!firstName) {
      alert("Please enter your first name.");
      return;
    }
    if (!lastName) {
      alert("Please enter your last name.");
      return;
    }
    if (!osisNumber) {
      alert("Please enter your OSIS Number/Student ID.");
      return;
    }
    if (!gradeLevel || isNaN(gradeLevel) || gradeLevel < 1 || gradeLevel > 12) {
      alert("Please enter a valid grade level between 1 and 12.");
      gradeLevelInput.focus();
      return;
    }
    if (!school) {
      alert("Please select at least one school.");
      return;
    }

    const fullName = `${firstName} ${middleName} ${lastName}`.replace(/\s+/g, ' ').trim();
    document.getElementById("displayName").innerText = fullName;

    const li = document.createElement("li");
    li.textContent = `${fullName} | Grade: ${gradeLevel} | OSIS: ${osisNumber} | School: ${school}`;
    document.getElementById("submittedNamesList").appendChild(li);

    const data = {
      first_name: firstName,
      middle_name: middleName,
      last_name: lastName,
      osis_id: osisNumber,
      school_name: school,
      grade_level: Number(gradeLevel)
    };

    await saveToSupabase(data);
  });

  document.getElementById("saveButton").addEventListener("click", () => {
    const items = document.querySelectorAll("#submittedNamesList li");
    if (items.length === 0) return alert("No names to save.");

    let text = "";
    items.forEach(item => text += item.textContent + "\n");

    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "submitted_names.txt";
    a.click();
  });
</script>

</body>
</html>
